mily:Georgia,"Times New Roman",serif;font-size:clamp(1.25rem,3vw,1.85rem);line-height:1.32;letter-spacing:-.02em;margin:14px 0 20px}.quiz-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.82rem}.progress{height:6px;background:#edf1ed;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;width:0;background:var(--green2);transition:width .2s}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:11px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;color:var(--ink);width:100%}.option .letter{flex:0 0 27px;width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#f1f4f1;color:var(--green);font-weight:800;font-size:.8rem}.option:hover:not(:disabled){border-color:#8ab89a;background:#fbfefb}.option.correct{border-color:#74aa87;background:#eff8f1}.option.correct .letter{background:#cce8d3}.option.incorrect{border-color:#d58a83;background:var(--redbg)}.option:disabled{cursor:default}.feedback{margin-top:16px;padding:14px 15px;border-radius:12px;background:#f1f7f2;border:1px solid #d7e9dc}.feedback.bad{background:#fff4f1;border-color:#f2d4ce}.feedback strong{display:block;margin-bottom:4px}.explain{color:#48584e;font-size:.92rem}.footer-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:17px}.subtle{color:var(--muted);font-size:.85rem}.flash-wrap{max-width:740px;margin:0 auto}.flashcard{min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 24px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);position:relative}.flashcard .prompt{max-width:570px;margin:18px auto}.flash-answer{font-size:1rem;max-width:600px;color:#34483b;white-space:pre-line;margin:0 auto}.flash-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}.tagline{font-size:.8rem;color:var(--muted)}.textarea{display:block;width:100%;min-height:145px;border:1px solid var(--line);border-radius:12px;padding:13px;resize:vertical;color:var(--ink);background:#fff}.key-list{display:grid;gap:8px;margin:13px 0}.key-item{padding:10px 12px;border-radius:10px;background:#f2f7f3;border:1px solid #e0ece3;font-size:.9rem}.callout{border-left:3px solid var(--gold);padding:10px 13px;background:#fff9eb;border-radius:0 10px 10px 0;color:#66552d;font-size:.88rem}.divider{height:1px;background:var(--line);margin:18px 0}.bar-row{display:grid;grid-template-columns:130px 1fr 45px;gap:12px;align-items:center;margin:12px 0;font-size:.85rem}.bar{height:9px;background:#edf1ed;border-radius:20px;overflow:hidden}.bar div{height:100%;background:var(--green2);border-radius:20px}.empty{text-align:center;padding:30px 20px}.empty .big{font-size:2rem}.empty h3{margin:9px 0}.empty p{color:var(--muted);margin:0 auto 17px;max-width:460px}.source{font-size:.87rem;color:var(--muted)}.source a{color:var(--green2);overflow-wrap:anywhere}.footnote{margin-top:22px;padding:0 4px;color:var(--muted);font-size:.8rem}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#183d2f;color:white;padding:10px 15px;border-radius:11px;box-shadow:var(--shadow);z-index:20;font-size:.87rem;max-width:calc(100vw - 24px)}
@media(max-width:700px){.hero{padding:24px 0}.nav{padding:8px 10px}.nav button{padding:9px 11px;font-size:.83rem}.shell{padding-left:13px;padding-right:13px}.content{padding-top:18px}.grid{gap:10px}.span-8,.span-6,.span-4{grid-column:span 12}.card{padding:16px;border-radius:15px}.section-head{display:block}.section-head .row{margin-top:14px}.action-card{min-height:0}.bar-row{grid-template-columns:95px 1fr 35px;gap:7px}.flashcard{min-height:320px;padding:27px 17px}.prompt{font-size:1.3rem}.footer-actions .btn{flex:1}.hero p{font-size:.93rem}}

<script>
'use strict';
const TOPICS={all:'Todos los temas',flower:'Flor',inflo:'Inflorescencias',reproduction:'Reproducción y fecundación',seed:'Semillas',fruit:'Frutos'};
const QUESTIONS=[
{ id:'q1',topic:'flower',type:'mcq',q:'¿Qué es un antófilo?',options:['Una hoja modificada que forma parte de una flor.','Una estructura que solo aparece en los frutos.','Un tipo de inflorescencia formada por flores sésiles.','La cubierta externa de una semilla.'],answer:0,why:'Los sépalos, pétalos, estambres y carpelos se consideran órganos florales derivados de estructuras foliares modificadas.'},
{ id:'q2',topic:'flower',type:'mcq',q:'¿Qué estructura recibe el polen?',options:['Ovario','Estilo','Estigma','Antera'],answer:2,why:'El estigma recibe el polen; el estilo conecta el estigma con el ovario, que contiene los óvulos.'},
{ id:'q3',topic:'flower',type:'tf',q:'Una especie diclino-monoica presenta flores masculinas y femeninas separadas en un mismo individuo.',answer:true,why:'El maíz es el ejemplo de la guía: flores masculinas en la inflorescencia terminal y femeninas en las mazorcas.'},
{ id:'q4',topic:'flower',type:'mcq',q:'En una flor hipógina, ¿cómo se dispone el ovario?',options:['Ínfero: las demás piezas se insertan por encima.','Súpero: las demás piezas se insertan por debajo.','Siempre está unido al receptáculo por completo.','No hay ovario.'],answer:1,why:'En las flores hipóginas, perianto y estambres se insertan por debajo del ovario; por eso el ovario es súpero.'},
{ id:'q5',topic:'flower',type:'mcq',q:'¿Cómo se denomina el perianto cuyos dos verticilos son semejantes y no se distinguen cáliz y corola?',options:['Heteroclamídeo','Homoclamídeo','Dialisépalo','Monadelfo'],answer:1,why:'En un perianto homoclamídeo, las piezas se llaman tépalos.'},
{ id:'q6',topic:'flower',type:'mcq',q:'¿Qué diferencia un androceo monadelfo?',options:['Las anteras se unen y los filamentos quedan libres.','Los filamentos forman un solo haz y las anteras quedan libres.','Todos los estambres son estériles.','Los filamentos forman tres o más grupos obligatoriamente.'],answer:1,why:'En el androceo monadelfo se unen los filamentos formando un único conjunto; un ejemplo de la guía es el hibisco.'},
{ id:'q7',topic:'flower',type:'mcq',q:'Una flor zigomorfa presenta…',options:['Varios planos de simetría radial.','Un plano de simetría bilateral.','Ningún plano de simetría.','Siempre cinco pétalos libres.'],answer:1,why:'Actinomorfa: varios planos; zigomorfa: un plano; asimétrica: ninguno.'},
{ id:'q8',topic:'flower',type:'tf',q:'Un estaminodio es un estambre estéril o que perdió total o parcialmente la función de producir polen.',answer:true,why:'Según la especie puede desempeñar funciones de atracción, protección o secreción.'},
{ id:'q9',topic:'flower',type:'mcq',q:'¿Qué término describe un gineceo con carpelos libres entre sí?',options:['Sincárpico','Gamopétalo','Apocárpico','Gamosépalo'],answer:2,why:'Apocárpico significa carpelos libres; sincárpico, carpelos unidos total o parcialmente.'},
{ id:'q10',topic:'flower',type:'mcq',q:'¿Qué describe una flor completa?',options:['Que tiene muchos pétalos.','Que presenta cáliz, corola, androceo y gineceo.','Que contiene semillas maduras.','Que carece de perianto.'],answer:1,why:'La completitud depende de la presencia de los cuatro verticilos florales, no de su número de piezas.'},
{ id:'q11',topic:'inflo',type:'mcq',q:'¿Por qué la margarita no es, en términos botánicos, una sola flor?',options:['Porque no tiene órganos reproductores.','Porque es una inflorescencia en capítulo con muchas flores pequeñas.','Porque sus pétalos se transforman en semillas.','Porque es una gimnosperma.'],answer:1,why:'El capítulo reúne flores individuales sobre un receptáculo común; las estructuras blancas periféricas son corolas de flores liguladas.'},
{ id:'q12',topic:'inflo',type:'mcq',q:'¿Qué es el involucro de un capítulo?',options:['El eje carnoso que porta las flores.','El conjunto de brácteas que rodea la base del capítulo.','La parte fértil de una antera.','El conjunto de semillas maduras.'],answer:1,why:'Las brácteas involucrales rodean y protegen el capítulo.'},
{ id:'q13',topic:'inflo',type:'mcq',q:'¿Qué inflorescencia tiene flores cuyos pedicelos parten de una zona común?',options:['Espiga','Racimo','Umbela','Espádice'],answer:2,why:'La cebolla se incluye en la guía como ejemplo de umbela.'},
{ id:'q14',topic:'inflo',type:'mcq',q:'¿Cuál es un ejemplo de espiga según la guía?',options:['Llantén','Cala','Avena','Cebolla'],answer:0,why:'El llantén presenta flores sésiles o casi sésiles sobre un eje alargado.'},
{ id:'q15',topic:'inflo',type:'tf',q:'En un capítulo, todas las piezas blancas de una margarita son pétalos de una única flor.',answer:false,why:'Cada pieza blanca periférica corresponde a la corola de una flor ligulada individual.'},
{ id:'q16',topic:'reproduction',type:'mcq',q:'¿Cuál es la diferencia fundamental entre espora y gameta?',options:['La espora siempre se fusiona con otra célula.','La gameta germina sin fusionarse.','La espora puede originar una fase del ciclo sin fusionarse; la gameta participa en la fecundación.','No hay diferencias funcionales.'],answer:2,why:'En el ciclo típico, las esporas originan gametofitos; la fusión de gametas origina el cigoto.'},
{ id:'q17',topic:'reproduction',type:'mcq',q:'¿Cómo se llama generalmente el gametofito de los helechos?',options:['Saco embrionario','Prótalo o protalo','Endospermo','Cotiledón'],answer:1,why:'El prótalo suele ser pequeño, verde y relativamente independiente del esporofito.'},
{ id:'q18',topic:'reproduction',type:'mcq',q:'¿Cuál es el gametofito masculino de las angiospermas?',options:['El ovario','El embrión','El grano de polen','El endospermo'],answer:2,why:'El grano de polen desarrolla el tubo polínico y transporta las gametas masculinas.'},
{ id:'q19',topic:'reproduction',type:'mcq',q:'En la doble fecundación de angiospermas, ¿con qué se fusiona la primera gameta masculina?',options:['Con la oosfera','Con el tegumento seminal','Con el nucelo','Con el endocarpo'],answer:0,why:'La fusión con la oosfera forma el cigoto diploide (2n), que origina el embrión.'},
{ id:'q20',topic:'reproduction',type:'mcq',q:'¿Qué resulta de la otra fusión en la doble fecundación típica?',options:['Un segundo embrión diploide','El núcleo primario del endospermo, generalmente 3n','La pared del fruto','Un prótalo haploide'],answer:1,why:'La otra gameta masculina se fusiona con la célula central que suele contener dos núcleos polares; así se origina el endospermo.'},
{ id:'q21',topic:'reproduction',type:'tf',q:'La reproducción vegetativa suele originar individuos genéticamente muy similares a la planta de origen.',answer:true,why:'Se basa principalmente en divisiones mitóticas y suele producir clones, salvo mutaciones.'},
{ id:'q22',topic:'reproduction',type:'mcq',q:'¿Qué estructura origina directamente el embrión?',options:['El endospermo','El cigoto','El ovario','El tegumento seminal'],answer:1,why:'El cigoto se divide y desarrolla hasta formar el embrión.'},
{ id:'q23',topic:'seed',type:'mcq',q:'¿Dónde se acumulan principalmente las reservas de una semilla endospermada o albuminada?',options:['En el endospermo persistente','En la pared del fruto','En el estigma','En el involucro'],answer:0,why:'Ejemplos de la guía: maíz, trigo y ricino.'},
{ id:'q24',topic:'seed',type:'mcq',q:'¿Qué caracteriza a una semilla exalbuminada?',options:['Conserva las reservas principales en el endospermo.','Acumula reservas principalmente en los cotiledones y el endospermo se consume durante el desarrollo.','Tiene reservas solo en la pared del fruto.','Carece de embrión.'],answer:1,why:'Poroto, arveja y maní son ejemplos incluidos en la guía.'},
{ id:'q25',topic:'seed',type:'mcq',q:'¿Qué tejido constituye las reservas de las semillas protaladas de gimnospermas?',options:['El endospermo 3n de las angiospermas','El gametofito femenino haploide persistente','El mesocarpo','El pericarpio'],answer:1,why:'No debe confundirse con el endospermo, habitualmente triploide, de las angiospermas.'},
{ id:'q26',topic:'seed',type:'mcq',q:'¿A qué estructura pertenece la radícula?',options:['Al embrión','Al involucro','Al ovario maduro','A la antera'],answer:0,why:'La radícula, la plúmula y los cotiledones son partes del embrión.'},
{ id:'q27',topic:'seed',type:'tf',q:'Tras la fecundación, el óvulo se transforma en semilla y el ovario generalmente forma el fruto.',answer:true,why:'Es una relación integradora central de la guía: ovario → fruto; óvulo → semilla; cigoto → embrión.'},
{ id:'q28',topic:'fruit',type:'mcq',q:'¿Qué rasgo identifica a una drupa?',options:['Un fruto que siempre se abre por dos suturas.','Un endocarpo endurecido o pétreo que forma el carozo.','Un fruto sin pericarpio.','Un conjunto de flores agrupadas.'],answer:1,why:'El endocarpo endurecido rodea la semilla. Ejemplos: durazno, cereza y aceituna.'},
{ id:'q29',topic:'fruit',type:'mcq',q:'¿Cuál es un fruto seco indehiscente?',options:['Legumbre','Folículo','Cariopse','Silicua'],answer:2,why:'El pericarpio de la cariopse está fusionado al tegumento seminal; maíz y trigo son ejemplos.'},
{ id:'q30',topic:'fruit',type:'mcq',q:'¿Qué caracteriza a los frutos dehiscentes?',options:['No se abren espontáneamente al madurar.','Se abren al madurar y liberan las semillas.','Siempre son carnosos.','Se originan únicamente de una inflorescencia completa.'],answer:1,why:'Legumbre, folículo y muchas cápsulas son ejemplos de frutos secos dehiscentes.'},
{ id:'q31',topic:'fruit',type:'mcq',q:'¿Cuál es un ejemplo de fruto verdadero tipo nuez, según la guía?',options:['Durazno','Tomate','Avellana','Naranja'],answer:2,why:'La nuez verdadera es seca, indehiscente y de pericarpio endurecido; también se menciona la bellota.'},
{ id:'q32',topic:'fruit',type:'tf',q:'Botánicamente, el fruto del nogal se clasifica aquí como una nuez verdadera porque ese es su nombre cotidiano.',answer:false,why:'La guía explica que Juglans regia se describe como drupa involucrada; el nombre popular no siempre coincide con la categoría botánica.'},
{ id:'q33',topic:'fruit',type:'mcq',q:'¿Qué parte del pericarpio corresponde a la piel del durazno?',options:['Endocarpo','Mesocarpo','Epicarpo o exocarpo','Tegumento seminal'],answer:2,why:'El epicarpo o exocarpo es la región externa; el mesocarpo suele formar parte de la pulpa y el endocarpo rodea la semilla.'},
{ id:'q34',topic:'fruit',type:'mcq',q:'¿Qué tipo de fruto es el grano de trigo?',options:['Drupa','Cariopse','Hesperidio','Folículo'],answer:1,why:'En las cariopses, el pericarpio se encuentra fusionado al tegumento seminal.'},
{ id:'q35',topic:'fruit',type:'mcq',q:'¿Qué diferencia a los frutos agregados de los frutos múltiples o infrutescencias?',options:['No hay diferencia.','Los agregados proceden de varios carpelos libres de una misma flor; los múltiples, de flores de una inflorescencia.','Los agregados siempre son secos y los múltiples siempre carnosos.','Los agregados proceden de semillas y los múltiples de hojas.'],answer:1,why:'Ejemplos de la guía: frambuesa como fruto agregado; ananá y morera como frutos múltiples o infrutescencias.'},
{ id:'q36',topic:'fruit',type:'tf',q:'En muchos frutos, la pared del ovario se transforma en el pericarpio.',answer:true,why:'El pericarpio puede diferenciarse en epicarpo/exocarpo, mesocarpo y endocarpo.'}
];
const CARDS=[
{id:'c1',topic:'flower',front:'Antófilo',back:'Hoja modificada que forma parte de una flor. Sépalos, pétalos, estambres y carpelos se consideran órganos florales derivados de estructuras foliares modificadas.'},
{id:'c2',topic:'flower',front:'Carpelo: partes y función',back:'Órgano reproductor femenino que contiene los óvulos. Estigma: recibe el polen. Estilo: permite el crecimiento del tubo polínico. Ovario: contiene los óvulos.'},
{id:'c3',topic:'flower',front:'Perigonio y tépalo',back:'Perigonio: perianto sin diferenciación clara entre cáliz y corola. Tépalo: cada pieza de ese perianto homoclamídeo, como las piezas coloreadas de un lirio.'},
{id:'c4',topic:'flower',front:'Androceo monadelfo',back:'Los filamentos de los estambres se unen formando un único haz, mientras las anteras permanecen libres. Ejemplo: hibisco.'},
{id:'c5',topic:'flower',front:'Apocárpico vs. sincárpico',back:'Apocárpico: carpelos libres entre sí. Sincárpico o gamocárpico: carpelos unidos total o parcialmente.'},
{id:'c6',topic:'flower',front:'Actinomorfa, zigomorfa y asimétrica',back:'Actinomorfa: varios planos de simetría radial. Zigomorfa: un plano de simetría bilateral. Asimétrica: ningún plano de simetría.'},
{id:'c7',topic:'flower',front:'Flor hipógina',back:'Perianto y estambres se insertan en el receptáculo por debajo del ovario. El ovario es súpero.'},
{id:'c8',topic:'flower',front:'Flor completa',back:'Presenta los cuatro verticilos: cáliz, corola, androceo y gineceo. Completa no significa necesariamente grande o con muchas piezas.'},
{id:'c9',topic:'inflo',front:'Inflorescencia',back:'Sistema de ramificación que porta las flores. Se diferencia de una flor individual porque reúne flores organizadas sobre un eje o receptáculo.'},
{id:'c10',topic:'inflo',front:'¿Por qué la margarita es un capítulo?',back:'Lo que parece una flor es una inflorescencia formada por muchas flores pequeñas sobre un receptáculo común. Las piezas blancas periféricas son corolas de flores liguladas; el centro contiene flores tubulosas.'},
{id:'c11',topic:'inflo',front:'Partes principales de un capítulo',back:'Pedúnculo: sostiene la inflorescencia. Receptáculo: zona donde se insertan las flores. Involucro: brácteas que rodean la base. Flores liguladas: periferia. Flores tubulosas: región central.'},
{id:'c12',topic:'inflo',front:'Racimo, espiga, espádice, umbela y panícula',back:'Racimo: flores pediceladas en eje alargado. Espiga: flores sésiles o casi sésiles. Espádice: eje carnoso, a menudo con espata. Umbela: pedicelos desde una zona común. Panícula: inflorescencia ramificada.'},
{id:'c13',topic:'reproduction',front:'Espora vs. gameta',back:'La espora puede germinar sin fusionarse con otra célula y originar un gametofito. La gameta participa en la fecundación: al fusionarse con otra gameta forma un cigoto.'},
{id:'c14',topic:'reproduction',front:'Gametofitos de helechos y angiospermas',back:'Helechos: prótalo o protalo, generalmente pequeño y verde; presenta anteridios y arquegonios. Angiospermas: grano de polen como gametofito masculino y saco embrionario como gametofito femenino.'},
{id:'c15',topic:'reproduction',front:'Doble fecundación: dos fusiones',back:'1) Gameta masculina + oosfera → cigoto 2n → embrión. 2) Gameta masculina + célula central con dos núcleos polares → núcleo primario del endospermo, habitualmente 3n.'},
{id:'c16',topic:'reproduction',front:'Reproducción sexual vs. multiplicación vegetativa',back:'Sexual: hay cigoto y combinación genética, por lo que suele aumentar la variabilidad. Vegetativa: nuevos individuos desde órganos o fragmentos (rizomas, estolones, tubérculos, bulbos o esquejes); suelen ser clones de la planta de origen.'},
{id:'c17',topic:'seed',front:'Semillas endospermadas, exalbuminadas y protaladas',back:'Endospermadas/albuminadas: reservas en endospermo (maíz, trigo, ricino). Exalbuminadas: reservas principalmente en cotiledones, el endospermo se consume durante el desarrollo (poroto, arveja, maní). Protaladas: reservas en gametofito femenino haploide de gimnospermas (pino, araucaria).'},
{id:'c18',topic:'seed',front:'¿Qué estructura origina a cuál?',back:'Ovario → fruto. Pared del ovario → pericarpio. Óvulo → semilla. Tegumentos del óvulo → tegumento seminal. Cigoto → embrión. El embrión incluye radícula, plúmula y cotiledones.'},
{id:'c19',topic:'fruit',front:'Las tres capas del pericarpio',back:'Epicarpo/exocarpo: región externa (piel del durazno). Mesocarpo: región intermedia, a menudo parte de la pulpa. Endocarpo: región interna alrededor de la semilla; puede ser membranosa, carnosa o pétrea.'},
{id:'c20',topic:'fruit',front:'Frutos carnosos: tipos y ejemplos',back:'Baya: tomate, uva. Drupa: durazno, cereza, aceituna. Hesperidio: naranja, limón. Pepónide: zapallo, pepino, sandía. Pomo: manzana, pera, membrillo.'},
{id:'c21',topic:'fruit',front:'Frutos secos indehiscentes',back:'No se abren espontáneamente al madurar. Ejemplos y tipos: aquenio, cipsela (girasol/diente de león), cariopse (maíz/trigo), nuez verdadera (avellana/bellota), sámara (arce/fresno), esquizocarpio y lomento.'},
{id:'c22',topic:'fruit',front:'Frutos secos dehiscentes',back:'Se abren al madurar para liberar semillas. Tipos: legumbre (dos suturas), folículo (una línea longitudinal), cápsula, silicua y silícula. Las cápsulas pueden ser loculicidas, septicidas, poricidas o circuncisas.'},
{id:'c23',topic:'fruit',front:'Nuez verdadera vs. “nuez” del nogal',back:'La nuez verdadera es un fruto seco, indehiscente y de pericarpio muy endurecido (avellana, bellota). La guía describe al nogal como drupa involucrada: el nombre cotidiano no coincide con la categoría botánica.'},
{id:'c24',topic:'fruit',front:'Frutos simples, agregados y múltiples',back:'Simple: ovario de una sola flor (durazno, tomate). Agregado: varios carpelos libres de una misma flor (frambuesa). Múltiple/infrutescencia: frutos de distintas flores de una inflorescencia quedan unidos (ananá, morera).'},
{id:'c25',topic:'fruit',front:'¿Qué es el fruto?',back:'En sentido botánico estricto, deriva del ovario maduro. La pared del ovario suele formar el pericarpio y los óvulos fecundados originan las semillas. Hay excepciones: partenocarpia, participación de tejidos accesorios e infrutescencias.'}
];

{id:'d2',topic:'flower',q:'Explicá la diferencia entre flor monoica y especie dioica y ejemplificá.',keys:['Monoica: flores masculinas y femeninas en la misma planta.','Dioica: flores masculinas y femeninas en individuos diferentes.','La guía menciona maíz y zapallo como monoicos y algunas especies de Salix como dioicas.','No confundir la sexualidad de una flor con la distribución de flores en la especie.']},
{id:'d3',topic:'flower',q:'Compará un perianto homoclamídeo con uno heteroclamídeo.',keys:['Homoclamídeo: los dos verticilos no se diferencian claramente; piezas llamadas tépalos.','Heteroclamídeo: cáliz formado por sépalos y corola formada por pétalos.','Ejemplo orientativo del homoclamídeo: lirio con seis tépalos.']},
{id:'d4',topic:'inflo',q:'Explicá por qué la margarita parece una flor pero es una inflorescencia.',keys:['Es un capítulo de Asteraceae con numerosas flores pequeñas.','Flores insertas en un receptáculo común y sostenidas por un pedúnculo.','Brácteas involucrales rodean la base.','Periferia: flores liguladas; centro: flores tubulosas.','Las piezas blancas no son pétalos de una sola flor: pertenecen a flores individuales.']},
{id:'d5',topic:'inflo',q:'Compará racimo, espiga, umbela, espádice y panícula con ejemplos.',keys:['Racimo: pedicelos en eje alargado; mostaza.','Espiga: flores sésiles o casi sésiles; llantén.','Umbela: pedicelos desde una zona común; cebolla.','Espádice: eje carnoso, suele acompañarse de espata; cala.','Panícula: inflorescencia ramificada; avena.']},
{id:'d6',topic:'reproduction',q:'Explicá la diferencia entre una espora y una gameta dentro del ciclo de vida vegetal.',keys:['La espora no necesita fusionarse; germina y origina un gametofito en el ciclo típico.','Las gametas deben fusionarse durante la fecundación.','La fusión de gametas origina el cigoto.','En el ciclo típico, el esporofito produce esporas por meiosis y el gametofito produce gametas.']},
{id:'d7',topic:'reproduction',q:'Desarrollá las dos etapas de la doble fecundación de las angiospermas y sus resultados.',keys:['El tubo polínico libera dos gametas masculinas en el óvulo.','Una se fusiona con la oosfera y forma el cigoto 2n, que origina el embrión.','La otra se fusiona con la célula central con dos núcleos polares.','En el caso típico se forma el núcleo primario del endospermo 3n y luego el endospermo nutritivo.','Óvulo → semilla; ovario → fruto, por regla general.']},
{id:'d8',topic:'reproduction',q:'Compará reproducción sexual y multiplicación vegetativa.',keys:['Sexual: se forma un cigoto y se combinan variantes genéticas.','Los descendientes sexuales pueden diferir entre sí y de la planta madre.','Vegetativa: nuevos individuos a partir de rizomas, estolones, tubérculos, bulbos o esquejes.','Los individuos vegetativos suelen ser clones, salvo mutaciones; multiplicación rápida y menor variabilidad general.']},
{id:'d9',topic:'seed',q:'Compará semillas endospermadas, exalbuminadas y protaladas.',keys:['Endospermadas/albuminadas: reserva principalmente en endospermo persistente; maíz, trigo, ricino.','Exalbuminadas: reserva principalmente en cotiledones; endospermo consumido durante el desarrollo; poroto, arveja, maní.','Protaladas: reserva en gametofito femenino haploide persistente de gimnospermas; pino y araucaria.','Distinguir el endospermo habitualmente 3n de angiospermas del gametofito femenino haploide de gimnospermas.']},
{id:'d10',topic:'seed',q:'Relacioná ovario, óvulo, cigoto, semilla y embrión.',keys:['El ovario generalmente se transforma en fruto.','El óvulo se transforma en semilla.','La pared del ovario origina el pericarpio y los tegumentos del óvulo contribuyen al tegumento seminal.','El cigoto origina el embrión.','El embrión incluye radícula, plúmula y cotiledones; la semilla puede contener tejidos de reserva.']},
{id:'d11',topic:'fruit',q:'Definí fruto y describí las partes del pericarpio.',keys:['En sentido estricto, fruto deriva del ovario maduro, aunque pueden participar tejidos accesorios.','La pared del ovario suele transformarse en pericarpio.','Epicarpo/exocarpo: zona externa.','Mesocarpo: zona intermedia, a menudo pulpa.','Endocarpo: zona interna que rodea la semilla; puede ser pétrea, como el carozo del durazno.']},
{id:'d12',topic:'fruit',q:'Diferenciá frutos secos dehiscentes e indehiscentes e incluí ejemplos.',keys:['Dehiscentes: se abren espontáneamente al madurar; legumbre, folículo, cápsula, silicua y silícula.','Indehiscentes: no se abren espontáneamente; aquenio, cipsela, cariopse, nuez verdadera y sámara.','Cariopse: pericarpio fusionado al tegumento seminal; maíz y trigo.','Sámara: fruto seco indehiscente con ala que favorece dispersión por viento.']},
{id:'d13',topic:'fruit',q:'Explicá por qué la nuez del nogal no es una nuez verdadera según la guía.',keys:['Nuez verdadera: fruto seco, indehiscente y de pericarpio endurecido; avellana y bellota.','La guía describe al nogal como una drupa involucrada.','Presenta cubierta externa carnosa y una región endurecida alrededor de la semilla.','El nombre popular “nuez” no equivale necesariamente al término morfológico.']}

const STORAGE='botanicaEnBolsillo_v1';
function blankStore(){return {attempts:0,correct:0,sessions:0,cardSchedule:{},devStatus:{},devAnswers:{},lastStudy:null};}
function loadStore(){try{return {...blankStore(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')};}catch(e){return blankStore();}}
let store=loadStore();
let ui={tab:'home',topic:'all',quizMode:'mix',queue:[],index:0,selected:null,answered:false,cardQueue:[],cardIndex:0,revealed:false,devQueue:[],devIndex:0,showKeys:false};
const app=document.getElementById('app');
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(store));}catch(e){toast('El navegador no permitió guardar el avance.');}}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function isoDay(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addDays(n){const d=today();d.setDate(d.getDate()+n);return isoDay(d);}
function topicName(k){return TOPICS[k]||'Tema';}
function filterTopic(items){return items.filter(x=>ui.topic==='all'||x.topic===ui.topic);}
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===ui.tab));}
function setTab(t){ui.tab=t;nav();render();window.scrollTo({top:0,behavior:'smooth'});}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.add('hidden'),2400);}
function dueCards(){return CARDS.filter(c=>{const s=store.cardSchedule[c.id];return !s||!s.due||s.due<=isoDay(today());});}
function statCard(value,label){return `<div class="card"><div class="metric">${value}</div><div class="metric-label">${label}</div></div>`;}
function topicSelect(){return `<div class="field"><label for="topicFilter">Tema</label><select id="topicFilter" data-change="topic">${Object.entries(TOPICS).map(([k,v])=>`<option value="${k}" ${ui.topic===k?'selected':''}>${v}</option>`).join('')}</select></div>`;}
function render(){nav();if(ui.tab==='home')renderHome();else if(ui.tab==='quiz')renderQuiz();else if(ui.tab==='flash')renderFlash();else if(ui.tab==='develop')renderDevelop();else if(ui.tab==='progress')renderProgress();else renderScience();}
function renderHome(){const due=dueCards().length;const accuracy=store.attempts?Math.round(store.correct/store.attempts*100):0;app.innerHTML=`
<div class="section-head"><div><div class="eyebrow-dark">Hola, estudiante 🌱</div><h2>Un repaso que entra en cualquier pausa.</h2><p>No hace falta releer toda la guía cada vez: intentá recordar, comprobá la respuesta y volvé sobre lo que todavía cuesta.</p></div></div>
<div class="grid">
<div class="span-4">${statCard(due,'flashcards pendientes hoy')}</div><div class="span-4">${statCard(store.attempts, 'preguntas respondidas')}</div><div class="span-4">${statCard(store.attempts?accuracy+'%':'—', 'aciertos en preguntas')}</div>
<div class="span-6"><div class="card action-card"><div class="action-icon">⚡</div><h3>Repaso rápido</h3><p>Una tanda mezclada de opción múltiple y verdadero/falso. Ideal para un viaje corto.</p><button class="btn" data-action="start-quiz" data-mode="mix">Empezar 10 preguntas</button></div></div>
<div class="span-6"><div class="card action-card"><div class="action-icon">▤</div><h3>Tarjetas pendientes</h3><p>Intentá contestar antes de revelar. Marcá si la recordaste para espaciar los próximos repasos.</p><button class="btn" data-action="start-flash" data-due="yes">Repasar ${due} pendientes</button></div></div>
<div class="span-4"><div class="card action-card"><div class="action-icon">◉</div><h3>Opción múltiple</h3><p>Reconocé conceptos y corregí tus errores con una explicación.</p><button class="btn secondary" data-action="start-quiz" data-mode="mcq">Practicar</button></div></div>
<div class="span-4"><div class="card action-card"><div class="action-icon">✓</div><h3>Verdadero o falso</h3><p>Detectá confusiones frecuentes entre estructuras, funciones y procesos.</p><button class="btn secondary" data-action="start-quiz" data-mode="tf">Practicar</button></div></div>
<div class="span-4"><div class="card action-card"><div class="action-icon">✍</div><h3>Preguntas de desarrollo</h3><p>Practicá explicar, comparar y relacionar como en un examen.</p><button class="btn secondary" data-action="start-dev">Responder</button></div></div>
<div class="span-12"><div class="card"><div class="eyebrow-dark">Mapa del parcial</div><h3 style="margin:4px 0 12px">Elegí un bloque para repasar</h3><div class="row">${Object.entries(TOPICS).filter(([k])=>k!=='all').map(([k,v])=>`<button class="btn ghost small" data-action="topic-home" data-topic="${k}">${v}</button>`).join('')}</div><div class="divider"></div><div class="callout"><strong>Una regla útil:</strong> primero respondé de memoria; después mirá la explicación. Reconocer una respuesta al leerla no es lo mismo que poder recuperarla sin ayuda.</div></div></div>
</div><div class="footnote">El avance se guarda en este navegador y dispositivo. Si abrís la app en otro dispositivo o borrás los datos del navegador, el progreso no se transfiere automáticamente.</div>`;}
function startQuiz(mode){ui.quizMode=mode;let pool=filterTopic(QUESTIONS).filter(q=>mode==='mix'||q.type===mode);ui.queue=shuffle(pool).slice(0,Math.min(10,pool.length));ui.index=0;ui.selected=null;ui.answered=false;store.sessions++;store.lastStudy=isoDay(today());save();setTab('quiz');}
function questionOptions(q){if(q.type==='tf')return [{label:'Verdadero',value:'true'},{label:'Falso',value:'false'}];return q.options.map((label,i)=>({label,value:String(i)}));}
function renderQuiz(){if(!ui.queue.length){app.innerHTML=`<div class="card empty"><div class="big">🧠</div><h3>No hay preguntas para este filtro</h3><p>Elegí otro tema o modo de práctica para continuar.</p><button class="btn" data-action="start-quiz" data-mode="mix">Repaso mezclado</button></div>`;return;}if(ui.index>=ui.queue.length){const pct=ui._sessionTotal?Math.round(ui._sessionCorrect/ui._sessionTotal*100):0;app.innerHTML=`<div class="card empty"><div class="big">${pct>=80?'🌿':'🌱'}</div><div class="eyebrow-dark">Tanda terminada</div><h2 style="margin:5px 0">${ui._sessionCorrect||0} aciertos de ${ui._sessionTotal||ui.queue.length}</h2><p>${pct>=80?'Buen trabajo. Para consolidarlo, volvé a practicar otro día.': 'Revisá las explicaciones de los errores y repetí otra tanda más adelante.'}</p><div class="row" style="justify-content:center"><button class="btn" data-action="start-quiz" data-mode="${ui.quizMode}">Otra tanda</button><button class="btn secondary" data-action="set-tab" data-tab="home">Volver al inicio</button></div></div>`;return;}
const q=ui.queue[ui.index],opts=questionOptions(q),ans=q.type==='tf'?String(q.answer):String(q.answer);const progress=(ui.index/ui.queue.length)*100;
app.innerHTML=`<div class="section-head"><div><div class="eyebrow-dark">Práctica de recuperación</div><h2>Preguntas</h2><p>Elegí una respuesta antes de mostrar la corrección.</p></div><div class="row">${topicSelect()}<div class="field"><label for="modeFilter">Formato</label><select id="modeFilter" data-change="mode"><option value="mix" ${ui.quizMode==='mix'?'selected':''}>Mezclado</option><option value="mcq" ${ui.quizMode==='mcq'?'selected':''}>Opción múltiple</option><option value="tf" ${ui.quizMode==='tf'?'selected':''}>Verdadero/falso</option></select></div></div></div>
<div class="card"><div class="quiz-meta"><span>${ui.index+1} de ${ui.queue.length}</span><span class="topic-pill">${topicName(q.topic)}</span></div><div class="progress"><div style="width:${progress}%"></div></div><div class="prompt">${escapeHtml(q.q)}</div><div class="options">${opts.map((o,i)=>{let cls='option';let disabled=ui.answered?'disabled':'';if(ui.answered&&o.value===ans)cls+=' correct';else if(ui.answered&&o.value===ui.selected)cls+=' incorrect';return `<button class="${cls}" ${disabled} data-action="choose" data-value="${o.value}"><span class="letter">${q.type==='tf'?(i===0?'V':'F'):String.fromCharCode(65+i)}</span><span>${escapeHtml(o.label)}</span></button>`;}).join('')}</div>
${ui.answered?`<div class="feedback ${ui.selected===ans?'':'bad'}"><strong>${ui.selected===ans?'¡Correcto!':'Todavía no. La respuesta correcta es: '+(q.type==='tf'?(q.answer?'Verdadero':'Falso'):q.options[q.answer])}</strong><div class="explain">${escapeHtml(q.why)}</div></div>`:''}
<div class="footer-actions"><span class="subtle">${ui.answered?(ui.selected===ans?'Respuesta recuperada':'Usá el error como señal de qué repasar'):'Sin apuntes: respondé de memoria'}</span>${ui.answered?`<button class="btn" data-action="next-question">${ui.index===ui.queue.length-1?'Ver resultado':'Siguiente'}</button>`:''}</div></div><div class="footnote">Este banco de preguntas está limitado a los conceptos y ejemplos de tu guía PDF. Para preguntas de desarrollo, usá la sección correspondiente.</div>`;}
function choose(value){if(ui.answered)return;const q=ui.queue[ui.index];ui.selected=value;ui.answered=true;const correct=String(q.answer)===String(value);store.attempts++;if(correct)store.correct++;ui._sessionTotal=(ui._sessionTotal||0)+1;if(correct)ui._sessionCorrect=(ui._sessionCorrect||0)+1;store.lastStudy=isoDay(today());save();renderQuiz();}
function nextQuestion(){ui.index++;ui.selected=null;ui.answered=false;renderQuiz();}
function startFlash(dueOnly){let pool=filterTopic(CARDS);if(dueOnly)pool=pool.filter(c=>{const s=store.cardSchedule[c.id];return !s||!s.due||s.due<=isoDay(today());});ui.cardQueue=shuffle(pool);ui.cardIndex=0;ui.revealed=false;setTab('flash');}
function renderFlash(){const cards=ui.cardQueue;if(!cards.length){app.innerHTML=`<div class="section-head"><div><div class="eyebrow-dark">Repetición espaciada</div><h2>Flashcards</h2><p>Las tarjetas marcadas como conocidas vuelven a aparecer cada vez más adelante. Las que cuestan vuelven pronto.</p></div><div class="row">${topicSelect()}</div></div><div class="card empty"><div class="big">🌿</div><h3>No tenés tarjetas pendientes en este filtro.</h3><p>Podés descansar y volver cuando llegue el próximo repaso, o practicar todas las tarjetas ahora.</p><button class="btn" data-action="start-flash" data-due="no">Repasar todas las tarjetas</button></div>`;return;}if(ui.cardIndex>=cards.length){app.innerHTML=`<div class="card empty"><div class="big">✨</div><h2>¡Terminaste esta tanda!</h2><p>Las tarjetas que marcaste como conocidas tienen su próximo repaso programado. Las que te costaron volverán antes.</p><div class="row" style="justify-content:center"><button class="btn" data-action="start-flash" data-due="yes">Ver pendientes</button><button class="btn secondary" data-action="set-tab" data-tab="home">Volver al inicio</button></div></div>`;return;}
const c=cards[ui.cardIndex],s=store.cardSchedule[c.id]||{};app.innerHTML=`<div class="section-head"><div><div class="eyebrow-dark">Recuperación activa + repetición espaciada</div><h2>Flashcards</h2><p>Intentá formular la respuesta antes de tocar “Revelar”. No marques “La sabía” solo porque la respuesta te resulta familiar.</p></div><div class="row">${topicSelect()}<button class="btn ghost small" data-action="start-flash" data-due="no">Todas</button></div></div><div class="flash-wrap"><div class="quiz-meta"><span>Tarjeta ${ui.cardIndex+1} de ${cards.length}</span><span class="topic-pill">${topicName(c.topic)}</span></div><div class="progress"><div style="width:${ui.cardIndex/cards.length*100}%"></div></div><div class="flashcard"><span class="tagline">${ui.revealed?'Respuesta':'Pregunta'}</span>${ui.revealed?`<div class="flash-answer">${escapeHtml(c.back)}</div>`:`<div class="prompt">${escapeHtml(c.front)}</div><button class="btn" data-action="reveal-card">Revelar respuesta</button>`}</div>${ui.revealed?`<div class="flash-actions"><button class="btn danger" data-action="rate-card" data-rate="again">Necesito repasarla</button><button class="btn" data-action="rate-card" data-rate="known">La pude recordar</button></div><p class="subtle" style="text-align:center;margin-top:12px">${s.due?'Próximo repaso actual: '+s.due:'Esta tarjeta todavía no tiene una fecha de repaso.'}</p>`:''}</div><div class="footnote">Plan orientativo de repaso: 1, 3, 7, 14 y 30 días si la recordás. Si te cuesta, vuelve al intervalo corto de 1 día. Los intervalos son una pauta práctica, no una regla universal.</div>`;}
function rateCard(rate){const c=ui.cardQueue[ui.cardIndex];if(!c)return;const s=store.cardSchedule[c.id]||{reps:0};if(rate==='known'){s.reps=(s.reps||0)+1;const intervals=[1,3,7,14,30];s.due=addDays(intervals[Math.min(s.reps-1,intervals.length-1)]);s.last=isoDay(today());s.status='known';}else{s.reps=0;s.due=addDays(1);s.last=isoDay(today());s.status='again';}store.cardSchedule[c.id]=s;save();ui.cardIndex++;ui.revealed=false;renderFlash();}
function startDev(){ui.devQueue=shuffle(filterTopic(DEVELOPMENT));ui.devIndex=0;ui.showKeys=false;setTab('develop');}
function renderDevelop(){if(!ui.devQueue.length){ui.devQueue=shuffle(filterTopic(DEVELOPMENT));ui.devIndex=0;}if(!ui.devQueue.length){app.innerHTML='<div class="card empty"><h3>No hay preguntas para este tema.</h3></div>';return;}if(ui.devIndex>=ui.devQueue.length){app.innerHTML=`<div class="card empty"><div class="big">✍️</div><h2>Terminaste las preguntas de desarrollo de esta tanda.</h2><p>Las respuestas abiertas sirven para detectar qué podés explicar sin pistas.</p><button class="btn" data-action="start-dev">Otra tanda</button></div>`;return;}const d=ui.devQueue[ui.devIndex],saved=store.devAnswers[d.id]||'';const status=store.devStatus[d.id];app.innerHTML=`<div class="section-head"><div><div class="eyebrow-dark">Práctica de elaboración</div><h2>Preguntas de desarrollo</h2><p>Escribí una respuesta breve como si estuvieras en el parcial. Después comparala con los puntos clave; no se corrige automáticamente.</p></div><div class="row">${topicSelect()}</div></div><div class="card"><div class="quiz-meta"><span>Pregunta ${ui.devIndex+1} de ${ui.devQueue.length}</span><span class="topic-pill">${topicName(d.topic)}</span></div><div class="prompt">${escapeHtml(d.q)}</div><label for="devAnswer" class="subtle" style="display:block;margin-bottom:7px">Tu respuesta (se guarda en este navegador)</label><textarea id="devAnswer" class="textarea" placeholder="Intentá explicarlo con tus palabras…">${escapeHtml(saved)}</textarea><div class="footer-actions"><button class="btn secondary" data-action="save-dev">Guardar respuesta</button><button class="btn" data-action="toggle-keys">${ui.showKeys?'Ocultar puntos clave':'Comparar con puntos clave'}</button></div>${ui.showKeys?`<div class="divider"></div><h3 style="margin:0 0 8px">Checklist para autoevaluarte</h3><p class="subtle">¿Incluiste las ideas centrales y las relaciones entre estructuras y funciones?</p><div class="key-list">${d.keys.map(k=>`<div class="key-item">□ ${escapeHtml(k)}</div>`).join('')}</div><div class="row"><button class="btn" data-action="rate-dev" data-rate="known">Pude explicarla</button><button class="btn danger" data-action="rate-dev" data-rate="again">Necesito repasarla</button></div>${status?`<p class="subtle">Última autoevaluación: ${status==='known'?'pude explicarla':'necesito repasarla'}.</p>`:''}`:''}<div class="footer-actions"><span class="subtle">No busques una redacción idéntica: verificá que estén los conceptos y relaciones.</span><button class="btn ghost" data-action="next-dev">Siguiente pregunta →</button></div></div>`;}
function saveDev(){const d=ui.devQueue[ui.devIndex];if(!d)return;store.devAnswers[d.id]=document.getElementById('devAnswer')?.value||'';save();toast('Respuesta guardada en este dispositivo.');}
function rateDev(rate){const d=ui.devQueue[ui.devIndex];if(!d)return;store.devStatus[d.id]=rate;save();toast(rate==='known'?'Autoevaluación guardada.':'Marcada para volver a practicar.');renderDevelop();}
function renderProgress(){const accuracy=store.attempts?Math.round(store.correct/store.attempts*100):0;const due=dueCards().length;const known=Object.values(store.cardSchedule).filter(s=>s.status==='known').length;const again=Object.values(store.cardSchedule).filter(s=>s.status==='again').length;const devKnown=Object.values(store.devStatus).filter(s=>s==='known').length;const devAgain=Object.values(store.devStatus).filter(s=>s==='again').length;const topics=['flower','inflo','reproduction','seed','fruit'];const topicRows=topics.map(t=>{const ids=QUESTIONS.filter(q=>q.topic===t).map(q=>q.id);const a=ids.filter(id=>false).length;return `<div class="bar-row"><span>${topicName(t)}</span><div class="bar"><div style="width:${store.attempts?accuracy:0}%"></div></div><strong>${store.attempts?accuracy+'%':'—'}</strong></div>`;}).join('');app.innerHTML=`<div class="section-head"><div><div class="eyebrow-dark">Tu proceso</div><h2>Mi avance</h2><p>El objetivo no es acumular clics, sino identificar lo que recordás y volver con intención a lo que cuesta.</p></div></div><div class="grid"><div class="span-4">${statCard(store.attempts,'preguntas respondidas')}</div><div class="span-4">${statCard(store.attempts?accuracy+'%':'—','porcentaje de aciertos')}</div><div class="span-4">${statCard(due,'tarjetas pendientes hoy')}</div><div class="span-6"><div class="card"><div class="eyebrow-dark">Flashcards</div><h3 style="margin:3px 0 12px">Repetición espaciada</h3><div class="row">${statCard(known,'marcadas como recordadas')}${statCard(again,'marcadas para repasar')}</div><div class="divider"></div><button class="btn" data-action="start-flash" data-due="yes">Repasar pendientes</button></div></div><div class="span-6"><div class="card"><div class="eyebrow-dark">Desarrollo</div><h3 style="margin:3px 0 12px">Autoevaluación</h3><div class="row">${statCard(devKnown,'pude explicarlas')}${statCard(devAgain,'necesito repasarlas')}</div><div class="divider"></div><button class="btn secondary" data-action="start-dev">Seguir practicando</button></div></div><div class="span-12"><div class="card"><h3 style="margin-top:0">Un plan simple para retomar</h3><div class="key-list"><div class="key-item"><strong>Hoy:</strong> hacé una tanda corta de preguntas y corregí los errores.</div><div class="key-item"><strong>Mañana:</strong> empezá por las tarjetas pendientes y las preguntas que te costaron.</div><div class="key-item"><strong>En unos días:</strong> volvé a intentar recuperar las definiciones y procesos sin leer la respuesta primero.</div></div><p class="subtle">El porcentaje general combina todas las preguntas respondidas y no es una calificación oficial del examen.</p><div class="divider"></div><button class="btn danger small" data-action="reset-progress">Borrar mi avance de este dispositivo</button></div></div></div>`;}
function renderScience(){app.innerHTML=`<div class="section-head"><div><div class="eyebrow-dark">Por qué está organizada así</div><h2>El método de repaso</h2><p>La app aplica estrategias de psicología cognitiva y educativa. No reemplaza la guía ni garantiza una nota: hace más sistemática la práctica de recordar.</p></div></div><div class="grid"><div class="span-6"><div class="card"><div class="action-icon">🧠</div><h3>1. Recuperación activa</h3><p>Responder una pregunta antes de mirar la solución obliga a recuperar la información. La prueba funciona también como práctica de aprendizaje, no solo como medición.</p><p class="source">Base: Roediger y Karpicke (2006), <em>Test-Enhanced Learning</em>. <a href="https://doi.org/10.1111/j.1467-9280.2006.01693.x" target="_blank" rel="noopener">Leer artículo</a>.</p></div></div><div class="span-6"><div class="card"><div class="action-icon">🗓️</div><h3>2. Práctica distribuida</h3><p>Volver a una tarjeta después de un intervalo puede favorecer la retención a largo plazo frente a concentrar todos los repasos en una sola sesión. Los intervalos dependen del tiempo hasta el examen y del material.</p><p class="source">Base: Cepeda y colaboradores (2006), revisión cuantitativa de la práctica distribuida. <a href="https://pubmed.ncbi.nlm.nih.gov/16719566/" target="_blank" rel="noopener">Leer resumen en PubMed</a>.</p></div></div><div class="span-6"><div class="card"><div class="action-icon">✍️</div><h3>3. Elaboración y explicación</h3><p>Las preguntas de desarrollo te piden explicar procesos y conexiones —por ejemplo, ovario → fruto, óvulo → semilla, cigoto → embrión— en lugar de memorizar listas aisladas. La comparación con puntos clave es una autoevaluación, no una corrección automática.</p><p class="source">Revisión general: Dunlosky y colaboradores (2013), <em>Improving Students’ Learning With Effective Learning Techniques</em>. <a href="https://doi.org/10.1177/1529100612453266" target="_blank" rel="noopener">Leer artículo</a>.</p></div></div><div class="span-6"><div class="card"><div class="action-icon">🎯</div><h3>4. Corrección y foco en errores</h3><p>Después de responder, leé la explicación y usá el error como información sobre qué volver a estudiar. Alternar temas también puede ayudarte a distinguir conceptos parecidos, como aquenio y cariopse o flores y capítulos.</p><p class="source">La selección de preguntas se limita al contenido de la guía que adjuntaste.</p></div></div><div class="span-12"><div class="card"><div class="eyebrow-dark">Alcance y honestidad</div><h3 style="margin:3px 0 8px">¿Qué hace y qué no hace esta app?</h3><p>Usa preguntas de opción múltiple, verdadero/falso, tarjetas con intervalos de repaso y preguntas de desarrollo. Guarda el progreso en el almacenamiento local del navegador. No usa inteligencia artificial para corregir textos abiertos, no sincroniza automáticamente entre dispositivos y no reemplaza las indicaciones específicas de tu cátedra.</p><p>El contenido se armó tomando como base tu PDF <em>Guía resuelta — Biología de Plantas y Algas: segundo parcial · flor, inflorescencias, reproducción, semillas y frutos</em>, incluido el resumen de relaciones integradoras de las páginas 12–14. Si en clase usan una definición o clasificación distinta, priorizá la de tu cátedra.</p></div></div></div>`;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-tab]');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}const a=b.dataset.action;switch(a){case'start-quiz':ui._sessionCorrect=0;ui._sessionTotal=0;startQuiz(b.dataset.mode||'mix');break;case'choose':choose(b.dataset.value);break;case'next-question':nextQuestion();break;case'start-flash':startFlash(b.dataset.due==='yes');break;case'reveal-card':ui.revealed=true;renderFlash();break;case'rate-card':rateCard(b.dataset.rate);break;case'start-dev':startDev();break;case'toggle-keys':saveDev();ui.showKeys=!ui.showKeys;renderDevelop();break;case'save-dev':saveDev();break;case'rate-dev':rateDev(b.dataset.rate);break;case'next-dev':saveDev();ui.devIndex++;ui.showKeys=false;renderDevelop();break;case'set-tab':setTab(b.dataset.tab);break;case'topic-home':ui.topic=b.dataset.topic;setTab('quiz');ui._sessionCorrect=0;ui._sessionTotal=0;startQuiz('mix');break;case'reset-progress':if(confirm('¿Seguro que querés borrar todo el progreso guardado en este navegador? Esta acción no se puede deshacer.')){store=blankStore();save();ui.queue=[];ui.cardQueue=[];ui.devQueue=[];renderProgress();toast('Avance borrado.');}break;}});
document.addEventListener('change',e=>{if(e.target.dataset.change==='topic'){ui.topic=e.target.value;if(ui.tab==='quiz'){ui._sessionCorrect=0;ui._sessionTotal=0;startQuiz(ui.quizMode);}else if(ui.tab==='flash'){ui.cardQueue=[];ui.cardIndex=0;ui.revealed=false;renderFlash();}else if(ui.tab==='develop'){ui.devQueue=[];ui.devIndex=0;ui.showKeys=false;renderDevelop();}}if(e.target.dataset.change==='mode'){ui._sessionCorrect=0;ui._sessionTotal=0;startQuiz(e.target.value);}});
document.addEventListener('input',e=>{if(e.target.id==='devAnswer'&&ui.tab==='develop'){const d=ui.devQueue[ui.devIndex];if(d){store.devAnswers[d.id]=e.target.value;save();}}});
render();
</script>
</body>
</html>
